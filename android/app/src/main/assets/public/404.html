<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zyvra — Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // GitHub Pages SPA fallback redirect to root index.html
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var base = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
        window.location.replace(window.location.origin + base);
      })();
    </script>
  </head>
  <body style="background:#0A0E17;color:#F8FAFC;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to Zyvra...</p>
  </body>
</html>
